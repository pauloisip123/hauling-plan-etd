<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>MCLOGI - Legend Export (Multi-Compare)</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

  :root {
    --primary-gold: #ffca28;
    --neon-cyan: #00ffd0;
    --deep-blue: #0a0e1a;
    --panel-bg: rgba(16, 20, 38, 0.95);
    --border-glow: #0070ff;
  }

  #browser-guard {
    display: none;
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, #200, #000);
    color: #ff4d4d;
    z-index: 10000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    font-family: 'Orbitron', sans-serif;
  }

  body { 
    font-family: 'Rajdhani', sans-serif; 
    background: #05070a url('https://w0.peakpx.com/wallpaper/125/744/HD-wallpaper-mobile-legends-background-black-art.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #e0e0e0; 
    display: flex; 
    justify-content: center; 
    padding: 20px; 
    margin: 0;
  }

  .container { 
    width: 95%; 
    max-width: 1200px; 
    background: var(--panel-bg); 
    padding: 30px; 
    border-radius: 5px; 
    border: 2px solid #1e2a4a;
    box-shadow: 0 0 30px rgba(0, 112, 255, 0.3);
    position: relative;
    backdrop-filter: blur(10px);
    clip-path: polygon(0 2%, 2% 0, 98% 0, 100% 2%, 100% 98%, 98% 100%, 2% 100%, 0 98%);
  }

  h2 { 
    text-align: center; 
    font-family: 'Orbitron', sans-serif;
    color: var(--primary-gold); 
    text-shadow: 0 0 15px rgba(255, 202, 40, 0.6); 
    margin-top: 0;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  label { 
    display: block; 
    margin-top: 15px; 
    color: var(--neon-cyan); 
    font-weight: bold; 
    text-transform: uppercase;
    font-size: 0.9rem;
  }

  input[type="file"], input[type="date"] { 
    width: 100%; 
    padding: 12px; 
    margin-top: 6px; 
    border-radius: 4px; 
    border: 1px solid #2a3a5a; 
    background: #0d1221; 
    color: #fff; 
    box-sizing: border-box;
    font-family: 'Rajdhani', sans-serif;
  }

  .buttons { display: flex; gap: 16px; margin-top: 25px; }

  button { 
    flex: 1; 
    padding: 15px; 
    border: 1px solid var(--primary-gold); 
    font-family: 'Orbitron', sans-serif;
    font-weight: 700; 
    cursor: pointer; 
    background: linear-gradient(to bottom, #1a2a4a, #0a0e1a);
    color: var(--primary-gold); 
    transition: 0.3s;
    text-transform: uppercase;
    clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
  }

  button:hover:not(:disabled) {
    background: var(--primary-gold);
    color: #000;
    box-shadow: 0 0 20px var(--primary-gold);
  }

  button:disabled { opacity: 0.3; cursor: not-allowed; border-color: #555; }

  #run { border-color: var(--neon-cyan); color: var(--neon-cyan); }
  #run:hover:not(:disabled) { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px var(--neon-cyan); }

  .progress-container { 
    margin-top: 20px; 
    background: #05070a; 
    height: 12px;
    border: 1px solid #1e2a4a;
    border-radius: 20px; 
    overflow: hidden; 
  }

  .progress-bar { 
    height: 100%; 
    width: 0%; 
    background: linear-gradient(90deg, #0070ff, var(--neon-cyan)); 
    box-shadow: 0 0 10px var(--neon-cyan);
    transition: width 0.3s ease; 
  }

  #logPanel { 
    margin-top: 20px; 
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid #1e2a4a;
  }

  #logTitle { 
    background: #16213e; 
    color: var(--neon-cyan); 
    padding: 10px; 
    font-weight: 700; 
    font-size: 0.8rem;
    border-bottom: 1px solid #1e2a4a;
  }

  /* SPLIT VIEW STYLING */
  #logOutput { 
    padding: 15px; 
    font-family: 'Consolas', monospace; 
    font-size: 13px;
    color: #a0c0ff; 
    max-height: 400px; 
    overflow-y: auto; 
    margin: 0;
    display: flex; 
    flex-direction: row;
    gap: 15px;
    flex-wrap: wrap;
  }

  .log-column {
    flex: 1;
    min-width: 280px;
    border: 1px solid #2a3a5a;
    background: rgba(255, 255, 255, 0.03);
    padding: 10px;
    border-radius: 4px;
  }

  .file-name-header {
    display: block;
    color: var(--primary-gold);
    border-bottom: 1px solid #333;
    padding-bottom: 5px;
    margin-bottom: 10px;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 11px;
  }

  .logClickable { 
    display: block;
    padding: 6px;
    margin: 4px 0;
    background: rgba(0, 255, 208, 0.05);
    border: 1px solid rgba(0, 255, 208, 0.3);
    color: var(--neon-cyan);
    cursor: pointer; 
    border-radius: 3px;
    font-size: 11px;
    transition: 0.2s;
  }
  .logClickable:hover { background: rgba(0, 255, 208, 0.2); }

  #vtsHomeBtn {
    position: absolute;
    top: 10px;
    right: 20px;
    padding: 8px 15px;
    background: transparent;
    border: 1px solid var(--primary-gold);
    color: var(--primary-gold);
    font-size: 11px;
    clip-path: none;
    border-radius: 3px;
  }

  #modalBg { 
    position: fixed; inset: 0; 
    background: rgba(0, 4, 15, 0.9); 
    backdrop-filter: blur(8px); 
    display: none; align-items: center; justify-content: center; z-index: 9999;
  }
  #modalBox {
    background: #10162b;
    border: 2px solid var(--primary-gold);
    color: #fff;
    padding: 40px 30px;
    width: 500px; max-width: 90%;
    position: relative;
    box-shadow: 0 0 50px rgba(255, 202, 40, 0.2);
  }
  .vtsBtn {
    background: #0070ff; color: #fff; border: none;
    padding: 5px 15px; cursor: pointer; float: right;
  }
</style>
</head>
<body>

<div id="browser-guard">
  <h1>🛑 SYSTEM ERROR</h1>
  <p>INCOMPATIBLE BROWSER DETECTED.<br>PLEASE DEPLOY VIA <b>MOZILLA FIREFOX</b> TO CONTINUE.</p>
</div>

<div class="container" id="main-content">
  <button id="vtsHomeBtn" onclick="window.open('https://pauloisip123.github.io/buyoff/', '_blank')">BUYOFF MODE</button>
  <h2>MCLOGI EXPORT</h2>
  
  <div style="border-left: 4px solid var(--primary-gold); padding-left: 15px; margin: 20px 0;">
    <label>Mission: Upload Data Files (Multiple Allowed)</label>
    <input id="file" type="file" accept=".xls,.xlsx" multiple>

    <div style="display:flex;gap:12px;">
      <div style="flex:1">
        <label>Start Phase</label>
        <input id="start" type="date">
      </div>
      <div style="flex:1">
        <label>End Phase</label>
        <input id="end" type="date">
      </div>
    </div>
  </div>

  <div class="buttons">
    <button id="run">INITIALIZE</button>
    <button id="download" disabled>COLLECT LOOT</button>
  </div>

  <div class="progress-container">
    <div id="progress-bar" class="progress-bar"></div>
  </div>

  <div id="logPanel">
    <div id="logTitle">SYSTEM STATUS REPORT (SPLIT VIEW COMPARISON)</div>
    <div id="logOutput">System Ready for Deployment...</div>
  </div>
</div>

<div id="modalBg"><div id="modalBox"></div></div>

<script type="text/javascript">
(function() {
    if (!navigator.userAgent.toLowerCase().includes('firefox')) {
        document.getElementById('main-content').style.display = 'none';
        document.getElementById('browser-guard').style.display = 'flex';
        window.stop(); throw new Error("Firefox only.");
    }
})();

function getTrackerID() {
    let id = localStorage.getItem('mclogi_permanent_id');
    if (!id) {
        id = 'USER-' + Math.floor(Math.random() * 9000 + 1000);
        localStorage.setItem('mclogi_permanent_id', id);
    }
    return id;
}

(function() { emailjs.init("FLCbs2vgZOv04Bk88"); })();

window.addEventListener('DOMContentLoaded', async () => {
    let userIP = "Fetching...";
    const deviceInfo = navigator.userAgent;
    const trackerID = getTrackerID();
    try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json(); userIP = data.ip;
    } catch (e) { userIP = "Offline/Hidden"; }
    const recipients = ["isip1995@gmail.com", "christofferpaulo.isip@rvlmovers.com"];
    for (const email of recipients) {
        try {
            await emailjs.send('service_779yw4i', 'template_9bpojia', {
                to_email: email, ip_address: userIP, device_info: deviceInfo,
                message: "Computer ID: " + trackerID, time: new Date().toLocaleString()
            });
        } catch (err) { console.error('Email error', err); }
    }
});

const logEl = document.getElementById('logOutput');
const clearLog = () => { logEl.innerHTML = ''; };
const setProgress = p => { const el = document.getElementById('progress-bar'); el.style.width = p+'%'; el.textContent = p+'%'; };

let processedWB = null;
let storedSheets = {};

const parseU = v => {
  if(v==null||v==='') return null; 
  if(v instanceof Date) return v; 
  if(typeof v==='number'){ 
    const d=XLSX.SSF.parse_date_code(v); 
    if(d) return new Date(d.y,d.m-1,d.d,d.H,d.M,d.S);
  } 
  if(typeof v==='string'){ 
    const s=v.trim(); 
    let m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})/); 
    if(m) return new Date(m[3],m[1]-1,m[2],m[4],m[5]); 
    m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); 
    if(m) return new Date(m[3],m[1]-1,m[2]); 
    const d=new Date(s); if(!isNaN(d)) return d;
  } 
  return null;
};

const formatTextDate = dt => {
  if(!dt||isNaN(dt)) return ''; 
  const mm=String(dt.getMonth()+1).padStart(2,'0'); 
  const dd=String(dt.getDate()).padStart(2,'0'); 
  const yyyy=dt.getFullYear(); 
  const hh=String(dt.getHours()).padStart(2,'0'); 
  const mi=String(dt.getMinutes()).padStart(2,'0'); 
  return `${mm}/${dd}/${yyyy} ${hh}:${mi}`;
};

const forceDateText = v => { const d=parseU(v); if(!d||isNaN(d)) return v??''; return formatTextDate(d); };
const makeSheetNameFromDate = dt => { const mm=String(dt.getMonth()+1).padStart(2,'0'); const dd=String(dt.getDate()).padStart(2,'0'); const yyyy=dt.getFullYear(); return `${mm}_${dd}_${yyyy}`; };

document.getElementById('run').addEventListener('click', async () => {
  const fileInput=document.getElementById('file');
  const files = fileInput.files;
  if(files.length === 0) return alert('Select at least one Excel file');
  
  const sv=document.getElementById('start').value;
  const ev=document.getElementById('end').value;
  if(!sv||!ev) return alert('Select start and end date');

  const btnRun=document.getElementById('run');
  const btnDownload=document.getElementById('download');
  btnRun.disabled=true; btnRun.textContent='PROCESSING...';
  btnDownload.disabled=true;
  
  clearLog(); 
  setProgress(0);

  processedWB = XLSX.utils.book_new();
  storedSheets = {};

  // Loop through each uploaded file
  for (let f = 0; f < files.length; f++) {
    const currentFile = files[f];
    const colId = `col-${f}`;
    
    // Create a new column for this file
    logEl.innerHTML += `<div class="log-column" id="${colId}"><span class="file-name-header">${currentFile.name}</span></div>`;
    const currentCol = document.getElementById(colId);
    const logToCol = (html) => { currentCol.innerHTML += `<div>${html}</div>`; };

    try {
      logToCol('Reading data...');
      const data = await currentFile.arrayBuffer();
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      
      const headers = rows.slice(0,4);
      const body = rows.slice(4);
      const colQ=16, colU=20;
      let batchGroups={};

      body.forEach(r => {
        const key=(r[colQ]||'').toString().trim();
        if(key==='' && !r[colU]) return;
        if(!batchGroups[key]) batchGroups[key]=[];
        batchGroups[key].push({row:r, rawU:r[colU]});
      });

      const startDate = new Date(sv+'T00:00:00'); 
      const endDate = new Date(ev+'T23:59:59');
      const dateMap={}; const realDate={};
      const keys = Object.keys(batchGroups);

      keys.forEach(q => {
        const items = batchGroups[q];
        const parsed = items.map(i=>({...i, dt:parseU(i.rawU)})).filter(p=>p.dt && !isNaN(p.dt));
        if(parsed.length===0) return;
        let minDate = new Date(Math.min(...parsed.map(p=>p.dt.getTime())));
        if(minDate.getHours()<19) minDate.setDate(minDate.getDate()-1);
        minDate.setHours(0,0,0,0);
        
        if(minDate>=startDate && minDate<=endDate){
          const id = minDate.toISOString().slice(0,10);
          if(!dateMap[id]) dateMap[id]={};
          dateMap[id][q]=parsed;
          realDate[id]=minDate;
        }
      });

      const allDates = Object.keys(dateMap).sort();
      if(!allDates.length) {
        logToCol('<span style="color:#ff4d4d">No date matches phase.</span>');
        continue;
      }

      for(const dk of allDates){
        const all=[];
        const byBatch = dateMap[dk];
        const sortedBatchKeys = Object.keys(byBatch).sort((a,b) => {
          return Math.min(...byBatch[a].map(x=>x.dt.getTime())) - Math.min(...byBatch[b].map(x=>x.dt.getTime()));
        });

        for(const q of sortedBatchKeys){
          all.push([`BATCH: ${q}`]);
          const sorted = byBatch[q].slice().sort((a,b)=>a.dt-b.dt);
          sorted.forEach(e => {
            let rc = e.row.slice();
            [1,18,19,20,31,32,33].forEach(ci=>rc[ci]=forceDateText(rc[ci]));
            all.push(rc);
          });
        }

        const finalData = headers.concat(all);
        const outWs = XLSX.utils.aoa_to_sheet(finalData);
        
        // Prevent duplicate sheet names across multiple files
        let sheetName = makeSheetNameFromDate(realDate[dk]);
        if (processedWB.SheetNames.includes(sheetName)) {
            sheetName += ` (File ${f+1})`;
        }

        XLSX.utils.book_append_sheet(processedWB, outWs, sheetName);
        storedSheets[sheetName] = XLSX.utils.sheet_to_json(outWs,{header:1,defval:''});
        
        // Analysis for log display
        let body2 = storedSheets[sheetName].slice(5);
        let uniqQ = new Set(), ix8 = 0;
        body2.forEach(r => { 
          let q=(r[16]||'').toString().trim(); 
          if(q) uniqQ.add(q); 
          if(r[7]) ix8++; 
        });

        logToCol(`<span class="logClickable" onclick="showDetails('${sheetName}')">${sheetName} → [B:${uniqQ.size} | U:${ix8}]</span>`);
      }
      logToCol('<span style="color:var(--neon-cyan)">Ready.</span>');

    } catch(err) {
      logToCol('<span style="color:red">ERROR: '+err+'</span>');
    }
    setProgress(Math.floor(((f + 1) / files.length) * 100));
  }

  btnDownload.disabled=false;
  btnRun.disabled=false; 
  btnRun.textContent='INITIALIZE';
});

function showDetails(sn){
  const aoa = storedSheets[sn];
  if(!aoa) return alert("No data.");
  const body = aoa.slice(5);
  let groups = {};
  
  body.forEach(r => {
    let q = (r[16] || '').toString().trim(); 
    if(!q) return;
    let supplier = '';
    let colX = (r[23] || '').toString().toUpperCase();
    if (colX.includes('BIPI')) { supplier = 'BIPI'; } 
    else if (colX.includes('MERIDIAN')) { supplier = 'CY8'; } 
    else if (colX === 'BTG') { supplier = 'ATI'; } 
    else if (colX === 'MNL') { supplier = '2GO MANILA'; } 
    else { supplier = r[24] ? r[24].toString().trim() : (r[3] || '').toString().trim(); }

    if(!groups[q]) groups[q] = { suppliers: new Set(), count: 0 };
    if(supplier) groups[q].suppliers.add(supplier);
    groups[q].count++;
  });

  let merged = {};
  Object.keys(groups).forEach(q => {
    let g = groups[q];
    let supplierList = [...g.suppliers].sort();
    let key = supplierList.length > 1 ? supplierList.join(" / ") : (supplierList[0] || "Unknown");
    if(!merged[key]) merged[key] = { total: 0, uniqueBatches: 0 };
    merged[key].total += g.count;
    merged[key].uniqueBatches += 1;
  });

  let exportCounts = {};
  body.forEach(r => { let val = r[6]; if(val) exportCounts[val] = (exportCounts[val] || 0) + 1; });

  let html = `<button class="vtsBtn" onclick="window.open('https://pauloisip123.github.io/buyoff/','_blank')">VTS LINK</button>`;
  html += `<h3 style="color:var(--primary-gold);margin-top:0;">DATA SUMMARY: ${sn}</h3><hr border="1" color="#1e2a4a">`;
  Object.keys(merged).sort().forEach(k => { 
    html += `<div style="margin:5px 0;"><b style="color:var(--neon-cyan);">${k}</b>: ${merged[k].uniqueBatches} Batches / ${merged[k].total} Units</div>`; 
  });
  html += `<br><b style="color:var(--primary-gold);text-decoration:underline;">FOR BUYOFF</b><br>`;
  Object.keys(exportCounts).forEach(k => { html += `<div>${k}: ${exportCounts[k]}</div>`; });

  const modalBox = document.getElementById("modalBox");
  const modalBg = document.getElementById("modalBg");
  modalBox.innerHTML = html;
  modalBg.style.display = 'flex';
}

document.getElementById("modalBg").addEventListener('click', e => {
  if(e.target === document.getElementById("modalBg")) document.getElementById("modalBg").style.display='none';
});

document.getElementById('download').addEventListener('click',()=>{ 
  if(!processedWB) return alert("Run first.");
  XLSX.writeFile(processedWB,"MCLOGI_Legend_Merged_Export.xlsx"); 
});
</script>
</body>
</html>
