<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>MCLOGI - Legend Export (Multi-Compare)</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

  :root {
    --primary-gold: #ffca28;
    --neon-cyan: #00ffd0;
    --deep-blue: #0a0e1a;
    --panel-bg: rgba(16, 20, 38, 0.95);
  }

  body { 
    font-family: 'Rajdhani', sans-serif; 
    background: #05070a url('https://w0.peakpx.com/wallpaper/125/744/HD-wallpaper-mobile-legends-background-black-art.jpg') no-repeat center center fixed;
    background-size: cover; color: #e0e0e0; display: flex; justify-content: center; padding: 20px; margin: 0;
  }

  .container { 
    width: 95%; max-width: 1200px; background: var(--panel-bg); padding: 30px; border-radius: 5px; 
    border: 2px solid #1e2a4a; box-shadow: 0 0 30px rgba(0, 112, 255, 0.3); position: relative;
    backdrop-filter: blur(10px); clip-path: polygon(0 2%, 2% 0, 98% 0, 100% 2%, 100% 98%, 98% 100%, 2% 100%, 0 98%);
  }

  h2 { text-align: center; font-family: 'Orbitron', sans-serif; color: var(--primary-gold); text-shadow: 0 0 15px rgba(255, 202, 40, 0.6); margin-top: 0; }

  .top-right-btns { position: absolute; top: 15px; right: 20px; display: flex; gap: 12px; }
  .nav-btn {
    padding: 8px 15px; background: transparent; border: 1px solid var(--primary-gold);
    color: var(--primary-gold); font-size: 11px; font-weight: bold; cursor: pointer; border-radius: 3px; font-family: 'Orbitron', sans-serif;
  }
  #scatterBtn { border-color: #ff00ff; color: #ff00ff; text-shadow: 0 0 8px #ff00ff; }

  label { display: block; margin-top: 15px; color: var(--neon-cyan); font-weight: bold; font-size: 0.9rem; }
  input[type="file"], input[type="date"] { 
    width: 100%; padding: 12px; margin-top: 6px; border-radius: 4px; border: 1px solid #2a3a5a; 
    background: #0d1221; color: #fff; box-sizing: border-box; font-family: 'Rajdhani', sans-serif;
  }

  .buttons { display: flex; gap: 16px; margin-top: 25px; }
  button.action-btn { 
    flex: 1; padding: 15px; border: 1px solid var(--primary-gold); font-family: 'Orbitron', sans-serif;
    font-weight: 700; cursor: pointer; background: linear-gradient(to bottom, #1a2a4a, #0a0e1a);
    color: var(--primary-gold); text-transform: uppercase; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
  }

  #logOutput { 
    padding: 15px; font-family: 'Consolas', monospace; font-size: 18px; 
    color: #a0c0ff; max-height: 400px; overflow-y: auto; display: flex; flex-direction: row; gap: 15px; flex-wrap: wrap;
  }
  .log-column { flex: 1; min-width: 280px; border: 1px solid #2a3a5a; background: rgba(255, 255, 255, 0.03); padding: 10px; border-radius: 4px; }
  .logClickable { 
    display: block; padding: 8px; margin: 6px 0; background: rgba(0, 255, 208, 0.05);
    border: 1px solid rgba(0, 255, 208, 0.3); color: var(--neon-cyan); cursor: pointer; border-radius: 3px; font-size: 16px; 
  }

  #modalBg, #gameModalBg { 
    position: fixed; inset: 0; background: rgba(0, 4, 15, 0.9); backdrop-filter: blur(8px); 
    display: none; align-items: center; justify-content: center; z-index: 9999;
  }
  #modalBox { background: #10162b; border: 2px solid var(--primary-gold); color: #fff; padding: 40px 30px; width: 500px; max-width: 90%; font-size: 1.2rem; }
  
  .vtsBtn { background: #0070ff; color: #fff; border: none; padding: 5px 15px; cursor: pointer; float: right; font-family: 'Orbitron'; font-size: 10px; }

  /* MITSUBISHI SLOT GAME STYLES */
  .slot-container { background: linear-gradient(145deg, #1a1a1a, #444); padding: 15px; border-radius: 15px; border: 5px solid red; }
  .slot-grid { display: grid; grid-template-columns: repeat(3, 110px); grid-template-rows: repeat(3, 110px); gap: 10px; background-color: #000; padding: 10px; border-radius: 10px; }
  .slot-cell { background: radial-gradient(circle, #222, #000); border: 2px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 35px; border-radius: 8px; font-weight: bold; }
  .car-label { font-size: 10px; color: #aaa; margin-top: 5px; text-transform: uppercase; }
</style>
</head>
<body>

<div class="container" id="main-content">
  <div class="top-right-btns">
    <button id="scatterBtn" class="nav-btn" onclick="openGame()">🎰 SCATTER MODE</button>
    <button class="nav-btn" onclick="window.open('https://pauloisip123.github.io/buyoff/', '_blank')">BUYOFF MODE</button>
  </div>

  <h2>MMPC HAULING PLAN EXPORT</h2>
  
  <div style="border-left: 4px solid var(--primary-gold); padding-left: 15px; margin: 20px 0;">
    <label>Mission: Upload Data Files</label>
    <input id="file" type="file" accept=".xls,.xlsx" multiple>
    <div style="display:flex;gap:12px;">
      <div style="flex:1"><label>Start Phase</label><input id="start" type="date"></div>
      <div style="flex:1"><label>End Phase</label><input id="end" type="date"></div>
    </div>
  </div>

  <div class="buttons">
    <button id="run" class="action-btn" style="color:var(--neon-cyan); border-color:var(--neon-cyan);">INITIALIZE</button>
    <button id="download" class="action-btn" disabled>COLLECT LOOT</button>
  </div>

  <div id="logPanel" style="margin-top:20px; background: rgba(0, 0, 0, 0.5); border: 1px solid #1e2a4a;">
    <div style="background: #16213e; color: var(--neon-cyan); padding: 10px; font-weight: 700;">SYSTEM STATUS REPORT (SPLIT VIEW)</div>
    <div id="logOutput">System Ready...</div>
  </div>
</div>

<div id="modalBg" onclick="if(event.target==this)this.style.display='none'"><div id="modalBox"></div></div>

<div id="gameModalBg" onclick="if(event.target==this)this.style.display='none'">
  <div style="text-align:center;">
    <h1 style="color:red; font-family:'Orbitron';">🚗 MITSUBISHI SPIN 🚗</h1>
    <div class="slot-container">
        <div class="slot-grid" id="slot-grid">
            <div class="slot-cell">🚗<div class="car-label">Mirage</div></div>
            <div class="slot-cell">🚐<div class="car-label">Xpander</div></div>
            <div class="slot-cell">🚘<div class="car-label">Montero</div></div>
            <div class="slot-cell">✨<div class="car-label">WILD</div></div>
            <div class="slot-cell">🚗<div class="car-label">Mirage</div></div>
            <div class="slot-cell">🚐<div class="car-label">Xpander</div></div>
            <div class="slot-cell">🚘<div class="car-label">Montero</div></div>
            <div class="slot-cell">✨<div class="car-label">WILD</div></div>
            <div class="slot-cell">🚗<div class="car-label">Mirage</div></div>
        </div>
    </div>
    <button onclick="spinSlot()" style="margin-top:25px; padding:15px 45px; background:red; color:white; font-weight:bold; border-radius:5px; cursor:pointer; font-size:20px; border:none; font-family:'Orbitron';">DRIVE SPIN</button>
    <div id="gameMsg" style="margin-top:20px; font-size:24px; color:white;">🏁 Ready to Roll 🏁</div>
  </div>
</div>

<script type="text/javascript">
(function() { emailjs.init("FLCbs2vgZOv04Bk88"); })();

const logEl = document.getElementById('logOutput');
let processedWB = null;
let storedSheets = {};

// DATING LOGIC HELPERS
const parseU = v => {
  if(v==null||v==='') return null; 
  if(v instanceof Date) return v; 
  if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); if(d) return new Date(d.y,d.m-1,d.d,d.H,d.M,d.S); }
  return new Date(v);
};
const forceDateText = v => { const d=parseU(v); return (!d||isNaN(d)) ? (v??'') : d.toLocaleString(); };
const makeSheetNameFromDate = dt => { return `${String(dt.getMonth()+1).padStart(2,'0')}_${String(dt.getDate()).padStart(2,'0')}_${dt.getFullYear()}`; };

document.getElementById('run').addEventListener('click', async () => {
  const files = document.getElementById('file').files;
  const sv = document.getElementById('start').value;
  const ev = document.getElementById('end').value;
  if(!files.length || !sv || !ev) return alert('Select files and dates.');

  logEl.innerHTML = '';
  processedWB = XLSX.utils.book_new();
  storedSheets = {};

  for (let f = 0; f < files.length; f++) {
    const colId = `col-${f}`;
    logEl.innerHTML += `<div class="log-column" id="${colId}"><span style="color:gold; font-weight:bold; border-bottom:1px solid #333; display:block; margin-bottom:5px;">${files[f].name}</span></div>`;
    const currentCol = document.getElementById(colId);

    try {
      const data = await files[f].arrayBuffer();
      const wb = XLSX.read(data);
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      
      const body = rows.slice(4);
      let batchGroups = {};
      body.forEach(r => {
        const key = (r[16]||'').toString().trim();
        if(!batchGroups[key]) batchGroups[key] = [];
        batchGroups[key].push({row:r, rawU:r[20]});
      });

      const startDate = new Date(sv+'T00:00:00');
      const endDate = new Date(ev+'T23:59:59');
      let dateMap = {};

      Object.keys(batchGroups).forEach(q => {
        const items = batchGroups[q];
        const parsed = items.map(i=>({...i, dt:parseU(i.rawU)})).filter(p=>p.dt && !isNaN(p.dt));
        if(!parsed.length) return;
        let minDate = new Date(Math.min(...parsed.map(p=>p.dt.getTime())));
        if(minDate.getHours() < 19) minDate.setDate(minDate.getDate()-1);
        minDate.setHours(0,0,0,0);
        
        if(minDate >= startDate && minDate <= endDate){
          const id = minDate.toISOString().slice(0,10);
          if(!dateMap[id]) dateMap[id] = { batches: {}, realDate: minDate };
          dateMap[id].batches[q] = parsed;
        }
      });

      Object.keys(dateMap).sort().forEach(dk => {
        const entry = dateMap[dk];
        let allRows = rows.slice(0,4);
        Object.keys(entry.batches).forEach(q => {
          allRows.push([`BATCH: ${q}`]);
          entry.batches[q].forEach(e => {
            let rc = e.row.slice();
            [1,18,19,20,31,32,33].forEach(ci=>rc[ci]=forceDateText(rc[ci]));
            allRows.push(rc);
          });
        });

        const sn = makeSheetNameFromDate(entry.realDate) + ` (${f})`;
        XLSX.utils.book_append_sheet(processedWB, XLSX.utils.aoa_to_sheet(allRows), sn);
        storedSheets[sn] = allRows;

        let uniqQ = Object.keys(entry.batches).length;
        let units = allRows.slice(4).filter(r => r.length > 5 && !r[0].toString().includes('BATCH')).length;
        currentCol.innerHTML += `<div class="logClickable" onclick="showDetails('${sn}')">${sn} → [ ${uniqQ} | ${units} ]</div>`;
      });
    } catch(e) { currentCol.innerHTML += `<div>Error: ${e.message}</div>`; }
  }
  document.getElementById('download').disabled = false;
});

function showDetails(sn){
  const aoa = storedSheets[sn];
  if(!aoa) return alert("No data.");
  const body = aoa.slice(5);
  let groups = {};
  
  body.forEach(r => {
    let q = (r[16] || '').toString().trim(); 
    if(!q) return;
    let supplier = '';
    let colX = (r[23] || '').toString().toUpperCase();
    if (colX.includes('BIPI')) { supplier = 'BIPI'; } 
    else if (colX.includes('MERIDIAN')) { supplier = 'CY8'; } 
    else if (colX === 'BTG') { supplier = 'ATI'; } 
    else if (colX === 'MNL') { supplier = '2GO MANILA'; } 
    else { supplier = r[24] ? r[24].toString().trim() : (r[3] || '').toString().trim(); }

    if(!groups[q]) groups[q] = { suppliers: new Set(), count: 0 };
    if(supplier) groups[q].suppliers.add(supplier);
    groups[q].count++;
  });

  let merged = {};
  Object.keys(groups).forEach(q => {
    let g = groups[q];
    let supplierList = [...g.suppliers].sort();
    let key = supplierList.length > 1 ? supplierList.join(" / ") : (supplierList[0] || "Unknown");
    if(!merged[key]) merged[key] = { total: 0, uniqueBatches: 0 };
    merged[key].total += g.count;
    merged[key].uniqueBatches += 1;
  });

  let exportCounts = {};
  body.forEach(r => { let val = r[6]; if(val) exportCounts[val] = (exportCounts[val] || 0) + 1; });

  let html = `<button class="vtsBtn" onclick="window.open('https://pauloisip123.github.io/buyoff/','_blank')">VTS LINK</button>`;
  html += `<h3 style="color:var(--primary-gold);margin-top:0;">DATA SUMMARY: ${sn}</h3><hr border="1" color="#1e2a4a">`;
  Object.keys(merged).sort().forEach(k => { 
    html += `<div style="margin:8px 0;"><b style="color:var(--neon-cyan);">${k}</b>: ${merged[k].uniqueBatches} Trips / ${merged[k].total} Units</div>`; 
  });
  html += `<br><b style="color:var(--primary-gold);text-shadow: 0 0 5px gold;">FOR BUYOFF</b><br>`;
  Object.keys(exportCounts).forEach(k => { html += `<div>${k}: ${exportCounts[k]}</div>`; });

  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modalBg").style.display = 'flex';
}

document.getElementById('download').addEventListener('click', () => {
    XLSX.writeFile(processedWB, "MCLOGI_Export.xlsx");
});

// MITSUBISHI SPIN LOGIC
function openGame() { document.getElementById('gameModalBg').style.display = 'flex'; }

const cars = [
    { icon: '🚗', name: 'Mirage' },
    { icon: '🚐', name: 'Xpander' },
    { icon: '🚘', name: 'Montero' },
    { icon: '✨', name: 'WILD' }
];

function spinSlot() {
    const cells = document.querySelectorAll('.slot-cell');
    const msg = document.getElementById('gameMsg');
    msg.innerText = "Revving engine...";
    msg.style.color = "white";
    let count = 0;
    
    const inv = setInterval(() => {
        cells.forEach(c => {
            const pick = cars[Math.floor(Math.random() * cars.length)];
            c.innerHTML = `${pick.icon}<div class="car-label">${pick.name}</div>`;
        });
        
        if(++count > 15){
            clearInterval(inv);
            const results = Array.from(cells).map(c => c.innerText.split('\n')[0]);
            // Check middle row win
            if(results[3] == results[4] && results[4] == results[5]) {
                msg.innerText = "JACKPOT! MITSUBISHI POWER! 🏁";
                msg.style.color = "red";
            } else {
                msg.innerText = "Nice Drive! Try again.";
            }
        }
    }, 80);
}
</script>
</body>
</html>
